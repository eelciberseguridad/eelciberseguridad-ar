<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02050d">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Experiencia tridimensional de realidad aumentada EEL Ciberseguridad.">
  <title>EEL CIBERSEGURIDAD</title>
  <!-- Libraries are kept locally. Retain vendor/ from the working project. -->
  <script src="vendor/aframe.min.js"></script>
  <script src="vendor/mindar-image-aframe.prod.js"></script>
  <script>
  (() => {
    'use strict';
    // Height-field relief makes a real 3D surface from local brightness values.
    // 2.5D interpretation: this is not a fully rigged / volumetric human model.
    if (typeof AFRAME === 'undefined') return;
    AFRAME.registerComponent('eel-relief', {
      schema: { image: { type:'selector' } },
      init() {
        const img=this.data.image;
        if(!img) return;
        const build=()=>{
          const THREE=AFRAME.THREE;
          const canvas=document.createElement('canvas'); canvas.width=128;canvas.height=128;
          const ctx=canvas.getContext('2d',{willReadFrequently:true});
          ctx.drawImage(img,0,0,128,128);
          const rgba=ctx.getImageData(0,0,128,128).data;
          const geometry=new THREE.PlaneGeometry(1,1,84,84);
          const pos=geometry.getAttribute('position');const uv=geometry.getAttribute('uv');
          for(let i=0;i<pos.count;i++){
            const u=uv.getX(i),v=uv.getY(i);
            const x=Math.min(127,Math.max(0,Math.round(u*127)));
            const y=Math.min(127,Math.max(0,Math.round((1-v)*127)));
            const idx=(y*128+x)*4;
            const brightness=(rgba[idx]*0.19+rgba[idx+1]*0.39+rgba[idx+2]*0.42)/255;
            const cx=(u-.5),cy=(v-.51);
            const person=Math.exp(-((cx/.235)**2+(cy/.34)**2)*1.30);
            const relief=0.095+brightness*0.026+person*0.034;
            pos.setZ(i,relief);
          }
          geometry.computeVertexNormals();
          const texture=new THREE.Texture(img);texture.needsUpdate=true;
          if('colorSpace' in texture && THREE.SRGBColorSpace) texture.colorSpace=THREE.SRGBColorSpace;
          else if(THREE.sRGBEncoding) texture.encoding=THREE.sRGBEncoding;
          const material=new THREE.MeshStandardMaterial({map:texture,transparent:true,alphaTest:0.01,
            side:THREE.DoubleSide,roughness:.52,metalness:.21,emissive:new THREE.Color('#03243f'),emissiveIntensity:.17});
          const mesh=new THREE.Mesh(geometry,material);
          mesh.renderOrder=1;
          this.el.setObject3D('reliefMesh',mesh);
        };
        if(img.complete&&img.naturalWidth>0)build();
        else img.addEventListener('load',build,{once:true});
      },
      remove(){this.el.removeObject3D('reliefMesh');}
    });

    window.addEventListener("DOMContentLoaded", () => {
    const target=document.getElementById('target');
    const scene=document.getElementById('scene');
    const error=document.getElementById('error');
    const showError=(message)=>{error.textContent=message;error.hidden=false;};
    const hideError=()=>{error.hidden=true;error.textContent='';};
    target.addEventListener('targetFound',()=>{
      document.body.classList.add('found');hideError();
      document.getElementById('rig').emit('eel-enter');
      document.getElementById('nameRig').emit('eel-enter');
    });
    target.addEventListener('targetLost',()=>document.body.classList.remove('found'));
    scene.addEventListener('arError',()=>showError('No se pudo iniciar la cámara o cargar el marcador. Comprobá el navegador y assets/target.mind.'));
    scene.addEventListener('arReady',hideError);
    window.addEventListener('pagehide',()=>{
      const sys=scene.systems&&scene.systems['mindar-image-system'];
      if(sys){try{sys.stop();}catch(e){}}
    });
    // A missing target file is an explicit error, never a silent black screen.
    fetch('assets/target.mind',{method:'HEAD',cache:'no-store'}).then(r=>{
      if(!r.ok)showError('Falta assets/target.mind en GitHub.');
    }).catch(()=>{});

    });
  })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#02050d; }
    body { font-family:Arial,Helvetica,sans-serif; }
    .identity {
      position:fixed; z-index:100; pointer-events:none;
      top:calc(env(safe-area-inset-top, 0px) + 20px); left:50%; transform:translateX(-50%);
      display:flex; justify-content:center; align-items:center;
      width:min(92vw,520px); padding:15px 19px;
      border:1px solid rgba(69,218,255,.4); border-radius:11px;
      background:linear-gradient(125deg,rgba(0,11,26,.87),rgba(3,31,52,.74) 50%,rgba(0,11,26,.87));
      box-shadow:0 0 1px 1px rgba(11,128,220,.15),0 0 32px rgba(2,159,255,.25),inset 0 0 24px rgba(18,103,164,.15);
      color:#eafcff; font-size:clamp(16px,4vw,23px); font-weight:800; letter-spacing:.12em;
      white-space:nowrap; text-shadow:0 0 5px rgba(197,245,255,.8),0 0 19px rgba(20,180,255,.55);
      transition:opacity .42s ease, transform .42s ease;
    }
    .identity:before { content:""; position:absolute; height:2px; left:7%; right:7%; bottom:5px; background:linear-gradient(90deg,transparent,#65e3ff,transparent); box-shadow:0 0 15px #39bbff; }
    body.found .identity { opacity:0; transform:translate(-50%,-12px); }
    #error { position:fixed;z-index:200;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);width:min(90vw,550px);padding:15px 18px;border:1px solid rgba(255,146,146,.5);border-radius:12px;color:white;background:rgba(38,7,15,.92);font:14px/1.5 Arial, sans-serif;text-align:center; }
    #error[hidden] { display:none!important; }
    a-scene { position:fixed!important; inset:0; width:100%!important;height:100%!important; }
    .a-enter-vr-button,.a-enter-ar-button,.mindar-ui-overlay { display:none!important; }
  </style>
</head>
<body>
  <div class="identity" aria-label="EEL CIBERSEGURIDAD">EEL CIBERSEGURIDAD</div>
  <div id="error" role="alert" hidden></div>

  <a-scene id="scene"
    mindar-image="imageTargetSrc: assets/target.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 0.25; warmupTolerance: 6; missTolerance: 10; maxTrack: 1"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="18000">
      <img id="logoPhoto" src="assets/logo-medallion.png" crossorigin="anonymous">
      <img id="hackerPhoto" src="assets/hacker-depth.png" crossorigin="anonymous">
      <img id="coatGlow" src="assets/coat-electric.png" crossorigin="anonymous">
      <img id="lensFlare" src="assets/spark.png" crossorigin="anonymous">
      <img id="beam" src="assets/scan-beam.png" crossorigin="anonymous">
      <img id="eelName" src="assets/eel-title.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" color="#c8eaff" intensity="0.75"></a-light>
    <a-light type="point" color="#37bfff" position="-0.7 0.65 1.5" intensity="1.7" distance="3" decay="1.5"></a-light>
    <a-light type="point" color="#9fe8ff" position="0.75 -0.45 1" intensity="0.65" distance="2.5"></a-light>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-entity id="rig" animation__intro="property: scale; from: 0.8 0.8 0.8; to: 1 1 1; dur: 760; easing: easeOutCubic; startEvents: eel-enter">
        <!-- Thick, genuinely 3D metallic base; it is not a flat CSS picture. -->
        <a-cylinder position="0 0 0.047" radius="0.510" height="0.095"
          segments-radial="96" rotation="90 0 0"
          material="color:#071827; metalness:0.8; roughness:0.25; emissive:#032241; emissiveIntensity:0.2"></a-cylinder>
        <!-- Displaced textured geometry: different pixel features have distinct depth. -->
        <a-entity eel-relief="image: #logoPhoto" position="0 0 0"></a-entity>
        <!-- Raised foreground hacker at a different Z plane: real parallax on tilt. -->
        <a-plane src="#hackerPhoto" position="0 0 0.175" width="1" height="1"
          material="shader:flat;transparent:true;alphaTest:0.025;depthWrite:false;side:double"></a-plane>
        <!-- Animated blue electric tracery follows the clothing. -->
        <a-plane src="#coatGlow" position="0 0 0.186" width="1" height="1"
          material="shader:flat;transparent:true;opacity:0.18;depthWrite:false;side:double"
          animation__coat="property:material.opacity;from:0.12;to:0.40;dur:2900;dir:alternate;loop:true;easing:easeInOutSine"></a-plane>
        <!-- Polished circular 3D rim + scanning arcs. -->
        <a-torus position="0 0 0.139" radius="0.514" radius-tubular="0.009" segments-tubular="96"
          material="color:#80dfff;metalness:0.7;roughness:0.2;emissive:#1db6ff;emissiveIntensity:0.53"></a-torus>
        <a-ring position="0 0 0.182" radius-inner="0.547" radius-outer="0.553" theta-start="11" theta-length="274"
          material="shader:flat;color:#5ed7ff;transparent:true;opacity:0.68;side:double;depthWrite:false"
          animation__spin="property:rotation;to:0 0 360;dur:26000;loop:true;easing:linear"></a-ring>
        <a-ring position="0 0 0.179" radius-inner="0.563" radius-outer="0.567" theta-start="142" theta-length="100"
          material="shader:flat;color:#b7f3ff;transparent:true;opacity:0.44;side:double;depthWrite:false"
          animation__spin="property:rotation;to:0 0 -360;dur:18000;loop:true;easing:linear"></a-ring>
        <a-plane src="#beam" position="0 -0.49 0.217" width="0.94" height="0.2"
          material="shader:flat;transparent:true;opacity:0.50;depthWrite:false;side:double"
          animation__scan="property:position;from:0 -0.47 0.217;to:0 0.47 0.217;dur:4300;loop:true;easing:linear"></a-plane>
        <!-- Embossed scanner's centerpiece in front of the outstretched hand. -->
        <a-entity position="-0.115 -0.055 0.345">
          <a-torus radius="0.083" radius-tubular="0.0023" segments-tubular="56"
            material="shader:flat;color:#55ceff;transparent:true;opacity:0.78"
            animation__turn="property:rotation;to:0 360 0;dur:8400;loop:true;easing:linear"></a-torus>
          <a-octahedron radius="0.031"
            material="color:#2dbdff;wireframe:true;emissive:#23a8f5;emissiveIntensity:0.85"
            animation__turn="property:rotation;to:360 360 0;dur:6800;loop:true;easing:linear"></a-octahedron>
          <a-sphere radius="0.007" material="shader:flat;color:#e0fcff;transparent:true;opacity:0.94"></a-sphere>
        </a-entity>
        <!-- Small restrained glints; dynamic but not nervous. -->
        <a-plane src="#lensFlare" position="-0.415 0.29 0.246" width="0.18" height="0.18"
          material="shader:flat;transparent:true;opacity:0.48;depthWrite:false"
          animation__glow="property:material.opacity;from:0.05;to:0.65;dur:2000;dir:alternate;loop:true;easing:easeInOutSine"></a-plane>
        <a-plane src="#lensFlare" position="0.43 -0.18 0.247" width="0.16" height="0.16"
          material="shader:flat;transparent:true;opacity:0.36;depthWrite:false"
          animation__glow="property:material.opacity;from:0.05;to:0.55;dur:2600;dir:alternate;loop:true;easing:easeInOutSine"></a-plane>

        <!-- One and only text, as a luminous 3D title plaque. -->
        <a-entity id="nameRig" position="0 -0.645 0.29"
          animation__name="property:scale;from:0.7 0.7 0.7;to:1 1 1;dur:900;easing:easeOutCubic;startEvents:eel-enter">
          <a-box width="1.45" height="0.235" depth="0.045"
            material="color:#061525;metalness:0.75;roughness:0.24;emissive:#06395c;emissiveIntensity:0.3"></a-box>
          <a-plane width="1.435" height="0.225" position="0 0 0.026"
            material="shader:flat;color:#061b2c;opacity:0.94;transparent:true"></a-plane>
          <a-plane width="1.30" height="0.206" position="0 0 0.030" src="#eelName"
            material="shader:flat;transparent:true;depthWrite:false;side:double"></a-plane>
          <a-box width="1.33" height="0.005" depth="0.009" position="0 -0.115 0.036"
            material="shader:flat;color:#69e5ff;emissive:#44bdff;emissiveIntensity:0.75"></a-box>
          <a-plane src="#beam" width="0.12" height="0.22" position="-0.71 0 0.040" rotation="0 0 90"
            material="shader:flat;transparent:true;opacity:0.28;depthWrite:false"
            animation__sweep="property:position;from:-0.66 0 0.040;to:0.66 0 0.040;dur:3600;loop:true;easing:linear"></a-plane>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

</body>
</html>
