<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070e">
  <meta name="referrer" content="no-referrer">
  <title>EEL CIBERSEGURIDAD</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/aframe.min.js"></script>
  <script src="vendor/mindar-image-aframe.prod.js"></script>
</head>
<body class="eel-body">
  <div id="hud" class="hud">
    <div class="brand-pill">
      <span class="brand-dot"></span>
      <span class="brand-text">EEL CIBERSEGURIDAD</span>
    </div>
    <div class="reticle" aria-hidden="true">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>
    <div id="errorBox" class="error-box" hidden></div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: assets/target.mind; autoStart: false; uiLoading: false; uiScanning: false; uiError: false; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 8;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="15000">
      <img id="coatFX" src="assets/coat-electric.png">
      <img id="sparkFX" src="assets/spark.png">
    </a-assets>

    <a-camera active="true" position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="eelTarget" mindar-image-target="targetIndex: 0">
      <a-plane
        id="coatLayer"
        src="#coatFX"
        position="0 0 0.018"
        width="1"
        height="1"
        material="shader: flat; transparent: true; opacity: 0.26; depthWrite: false; side: double"
        animation__glow="property: material.opacity; from: 0.16; to: 0.34; dur: 2600; dir: alternate; loop: true; easing: easeInOutSine">
      </a-plane>

      <a-ring
        id="ringOuter"
        position="0 0 0.060"
        radius-inner="0.515"
        radius-outer="0.522"
        material="shader: flat; color: #37c7ff; transparent: true; opacity: 0.56; side: double; depthWrite: false"
        animation__rotate="property: rotation; to: 0 0 360; dur: 36000; loop: true; easing: linear">
      </a-ring>

      <a-ring
        id="ringArc"
        position="0 0 0.068"
        radius-inner="0.545"
        radius-outer="0.551"
        theta-start="24"
        theta-length="220"
        material="shader: flat; color: #9eefff; transparent: true; opacity: 0.34; side: double; depthWrite: false"
        animation__rotate="property: rotation; to: 0 0 -360; dur: 42000; loop: true; easing: linear">
      </a-ring>

      <a-entity id="sparkGroup" position="0 0 0.12">
        <a-plane src="#sparkFX" width="0.16" height="0.16" position="-0.34 0.24 0"
          material="shader: flat; transparent: true; opacity: 0.42; depthWrite: false"
          animation__p1="property: position; to: -0.32 0.27 0; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine"></a-plane>
        <a-plane src="#sparkFX" width="0.13" height="0.13" position="0.31 0.27 0"
          material="shader: flat; transparent: true; opacity: 0.30; depthWrite: false"
          animation__p2="property: position; to: 0.29 0.30 0; dir: alternate; dur: 3400; loop: true; easing: easeInOutSine"></a-plane>
        <a-plane src="#sparkFX" width="0.14" height="0.14" position="-0.26 -0.26 0"
          material="shader: flat; transparent: true; opacity: 0.28; depthWrite: false"
          animation__p3="property: position; to: -0.24 -0.22 0; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine"></a-plane>
        <a-plane src="#sparkFX" width="0.14" height="0.14" position="0.28 -0.24 0"
          material="shader: flat; transparent: true; opacity: 0.32; depthWrite: false"
          animation__p4="property: position; to: 0.26 -0.20 0; dir: alternate; dur: 3600; loop: true; easing: easeInOutSine"></a-plane>
      </a-entity>

      <a-entity id="titleGroup" class="revealable" position="0 0.66 0.16" scale="0.001 0.001 0.001">
        <a-plane width="1.18" height="0.18" position="0 0 0"
          material="shader: flat; color: #04111b; transparent: true; opacity: 0.80; side: double"></a-plane>
        <a-plane width="1.16" height="0.176" position="0 0 0.002"
          material="shader: flat; color: #48d0ff; transparent: true; opacity: 0.11; wireframe: true; side: double"></a-plane>
        <a-plane width="0.74" height="0.004" position="0 -0.055 0.003"
          material="shader: flat; color: #6fe6ff; transparent: true; opacity: 0.95"></a-plane>
        <a-text value="EEL CIBERSEGURIDAD" align="center" color="#e7fbff" width="1.98" position="0 0.01 0.004"></a-text>
      </a-entity>

      <a-entity id="coreGroup" class="revealable" position="0 -0.06 0.22" scale="0.001 0.001 0.001">
        <a-torus radius="0.094" radius-tubular="0.0019"
          material="shader: flat; color: #52d4ff; transparent: true; opacity: 0.82"
          animation__coreRot="property: rotation; to: 0 360 0; dur: 12000; loop: true; easing: linear"></a-torus>
        <a-ring radius-inner="0.060" radius-outer="0.064"
          material="shader: flat; color: #99efff; transparent: true; opacity: 0.52; side: double"
          animation__corePulse="property: scale; to: 1.06 1.06 1.06; dir: alternate; dur: 1900; loop: true; easing: easeInOutSine"></a-ring>
      </a-entity>
    </a-entity>
  </a-scene>

  <script src="js/experience.js"></script>
</body>
</html>
