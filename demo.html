<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EEL CIBERSEGURIDAD</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse 65% 54% at 50% 46%,#153456 0%,#071627 42%,#02070e 77%,#000309 100%);font-family:Arial,sans-serif;perspective:1000px}
body:before{content:'';position:fixed;inset:-40%;background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(47,148,207,.04) 39px 40px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(47,148,207,.04) 39px 40px);transform:rotateX(58deg);pointer-events:none}
.stage{position:relative;width:min(83vw,580px);aspect-ratio:1;transform-style:preserve-3d;transform:rotateX(5deg) rotateY(-11deg);animation:tilt 8s ease-in-out infinite alternate;filter:drop-shadow(0 25px 55px rgba(0,0,0,.72))}
@keyframes tilt{from{transform:rotateX(4deg) rotateY(-11deg)}to{transform:rotateX(-5deg) rotateY(11deg)}}
.disk{position:absolute;inset:0;border-radius:50%;transform:translateZ(0px);background:linear-gradient(110deg,#1e5c85,#031321 25%,#030b16 68%,#367ba0);border:7px solid #0c273c;box-shadow:inset 0 0 12px #50d4ff,0 0 48px #1675b5,0 32px 30px #000}
.disk:after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(112,225,255,.58);box-shadow:inset 0 0 20px rgba(45,195,255,.3),0 0 18px rgba(45,195,255,.45)}
.photo,.hacker,.coat{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-style:preserve-3d}
.photo{transform:translateZ(18px)}.hacker{transform:translateZ(47px) scale(1.01);filter:drop-shadow(0 0 11px rgba(86,197,255,.18))}
.coat{transform:translateZ(50px);opacity:.23;animation:coat 2.6s ease-in-out infinite alternate}@keyframes coat{to{opacity:.56;filter:brightness(1.3)}}
.ring,.ring2{position:absolute;inset:-6%;border-radius:50%;border:3px solid transparent;border-top-color:#67e5ff;border-left-color:rgba(35,173,255,.78);transform:translateZ(66px);box-shadow:0 0 11px rgba(84,212,255,.14);animation:spin 28s linear infinite}.ring2{inset:-9%;border-width:2px;border-right-color:#8ceeff;border-left-color:transparent;border-top-color:transparent;opacity:.6;animation-duration:36s;animation-direction:reverse}@keyframes spin{to{transform:translateZ(66px) rotate(360deg)}}
.scan{position:absolute;left:5%;width:90%;height:10%;top:8%;transform:translateZ(74px);background:linear-gradient(0deg,transparent,rgba(38,185,255,.06) 25%,rgba(85,223,255,.52) 50%,transparent 75%);filter:blur(3px);opacity:.52;animation:scan 4.5s linear infinite}@keyframes scan{from{top:5%}to{top:85%}}
.core{position:absolute;left:45%;top:47%;width:12%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(103,233,255,.9);transform:translateZ(115px) rotateX(58deg);box-shadow:0 0 24px rgba(59,201,255,.7),inset 0 0 15px rgba(81,205,255,.3);animation:spin2 9s linear infinite}
.core:before{content:'';position:absolute;inset:30%;border:1px solid #e4fbff;transform:rotate(45deg);background:rgba(20,151,219,.22)}@keyframes spin2{to{transform:translateZ(115px) rotateX(58deg) rotate(360deg)}}
.title{position:absolute;left:-16%;right:-16%;bottom:-27%;height:22%;transform:translateZ(126px);border:1px solid rgba(88,213,255,.58);border-radius:7px;background:linear-gradient(155deg,rgba(2,24,39,.94),rgba(2,10,25,.92));box-shadow:0 0 23px rgba(31,159,223,.43),inset 0 0 22px rgba(27,145,220,.2);display:grid;place-items:center;overflow:hidden}
.title:after{content:'';position:absolute;left:6%;right:6%;bottom:8%;height:3px;background:linear-gradient(90deg,transparent,#65dfff,transparent);box-shadow:0 0 14px #4fb4fc}
.title img{display:block;width:97%;height:auto;filter:drop-shadow(0 0 10px rgba(65,193,255,.75))}
.title:before{content:'';position:absolute;inset:-80% auto -80% -50%;width:15%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(110,224,255,.26),transparent);animation:sweep 3.9s linear infinite;z-index:2}@keyframes sweep{to{left:140%}}
@media(max-width:530px){.stage{width:70vw}.title{bottom:-36%;height:31%}}
@media(prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<div class="stage" aria-label="EEL CIBERSEGURIDAD">
  <div class="disk"></div>
  <img class="photo" src="assets/logo-medallion.png" alt="">
  <img class="hacker" src="assets/hacker-depth.png" alt="">
  <img class="coat" src="assets/coat-electric.png" alt="">
  <div class="ring"></div><div class="ring2"></div><div class="scan"></div><div class="core"></div>
  <div class="title"><img src="assets/eel-title.png" alt="EEL CIBERSEGURIDAD"></div>
</div>
</body>
</html>
