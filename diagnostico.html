<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>EEL — Diagnóstico de cámara</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020812;color:#e6f7ff;font-family:system-ui,Arial,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#020812}#panel{position:fixed;z-index:5;left:12px;right:12px;top:max(18px,env(safe-area-inset-top));padding:12px 14px;border-radius:9px;background:#061b2bdc;border:1px solid #369dc0}#status{font-size:14px;font-weight:700}#detail{font-size:12px;color:#c1daec;margin-top:5px}#retry{margin-top:12px;background:#1175aa;color:white;border:1px solid #85d8fb;border-radius:7px;padding:10px 14px;font-weight:700}
</style></head><body>
<video id="camera" autoplay muted playsinline></video>
<div id="panel"><div id="status">Comprobando la cámara del celular…</div><div id="detail">Este diagnóstico muestra el video sin utilizar MindAR ni A-Frame. No guarda ni envía imágenes.</div><button id="retry" hidden>REINTENTAR CÁMARA</button></div>
<script>
(()=>{'use strict'; const v=document.getElementById('camera'), status=document.getElementById('status'), detail=document.getElementById('detail'), retry=document.getElementById('retry');let stream=null;
async function stop(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null;}v.srcObject=null;}
async function start(){retry.hidden=true;status.textContent='Solicitando cámara…';try{await stop(); if(!navigator.mediaDevices?.getUserMedia)throw new Error('getUserMedia no está disponible.');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});}catch(e){if(e.name==='OverconstrainedError'||e.name==='NotFoundError')stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});else throw e;}v.srcObject=stream;await v.play();status.textContent='CÁMARA ACTIVA ✓';detail.textContent='Si ves la imagen real de la cámara, Chrome funciona. El problema está en la integración de MindAR/escena, no en el permiso.';}catch(e){status.textContent='NO SE PUDO MOSTRAR LA CÁMARA';detail.textContent=(e.name||'Error')+': '+(e.message||String(e));retry.hidden=false;}}
retry.addEventListener('click',start);window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)void stop();});void start();})();
</script></body></html>
